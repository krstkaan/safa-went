host: localhost:8080
info:
  contact: {}
  title: Safa API
  version: "1.0"
paths:
  /approvers:
    get:
      description: Get a paginated list of Approver records
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 15)
        in: query
        name: per_page
        type: integer
      - description: Search by name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.ApproverCollection'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: List all Approver records
      tags:
      - Approver
    post:
      consumes:
      - application/json
      parameters:
      - description: Approver payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/requests.ApproverPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/resources.ApproverResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create an Approver
      tags:
      - Approver
  /approvers/{id}:
    delete:
      parameters:
      - description: Approver ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete an Approver
      tags:
      - Approver
    get:
      parameters:
      - description: Approver ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.ApproverResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get an Approver by ID
      tags:
      - Approver
    put:
      consumes:
      - application/json
      parameters:
      - description: Approver ID
        in: path
        name: id
        required: true
        type: integer
      - description: Approver update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/requests.ApproverUpdatePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.ApproverResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update an Approver
      tags:
      - Approver
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password, returns a JWT token
      parameters:
      - description: Login payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/requests.LoginPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.AuthResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      description: Invalidate the current session (client should discard the token)
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account and return a JWT token
      parameters:
      - description: Register payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/requests.RegisterPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/resources.AuthResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/responses.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorBody'
      summary: Register a new user
      tags:
      - Auth
  /auth/user:
    get:
      description: Returns the authenticated user's information
      produces:
